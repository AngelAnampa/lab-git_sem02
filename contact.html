<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos version -- A</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; line-height: 1.6;">

    <nav style="background-color: #1e293b; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 30px;">
        <a href="index.html" style="color: #f8fafc; text-decoration: none; margin: 0 15px; font-size: 18px;">Inicio</a>
        <a href="about.html" style="color: #f8fafc; text-decoration: none; margin: 0 15px; font-size: 18px;">Acerca de</a>
        <a href="contact.html" style="color: #38bdf8; text-decoration: none; font-weight: bold; margin: 0 15px; font-size: 18px;">Contacto</a>
    </nav>

    <main style="max-width: 800px; margin: 0 auto; background-color: #1e293b; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
        <h1 style="color: #38bdf8; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 10px;">Ponte en Contacto</h1>
        <p style="text-align: center; font-size: 16px;">¿Tienes alguna duda o quieres colaborar con nosotros? Envíanos un mensaje.</p>
        
        <form style="display: block; margin-top: 20px;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #cbd5e1;">Nombre:</label>
                <input type="text" placeholder="Tu nombre" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #475569; background-color: #0f172a; color: white; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #cbd5e1;">Correo Electrónico:</label>
                <input type="email" placeholder="correo@ejemplo.com" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #475569; background-color: #0f172a; color: white; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #cbd5e1;">Mensaje:</label>
                <textarea rows="4" placeholder="Escribe tu mensaje aquí..." style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #475569; background-color: #0f172a; color: white; box-sizing: border-box;"></textarea>
            </div>

            <button type="button" style="background-color: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px;">Enviar Mensaje</button>
        </form>
    </main>

    <footer style="text-align: center; margin-top: 40px; color: #94a3b8; font-size: 14px;">
        <p>&copy; 2026 Explora el Universo - Proyecto Web</p>
    </footer>

</body>
</html>
